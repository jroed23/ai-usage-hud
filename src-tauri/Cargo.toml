[package]
name = "ai-usage-hud"
version = "0.1.2"
description = "Monitor your AI usage. Anywhere. In real time."
authors = ["AI Usage HUD contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "ai_usage_hud_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-store = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
